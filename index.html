<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List Interaktif</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Link Javascript -->
    <script src="script.js" defer></script>

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex items-center justify-center p-4 sm:p-6 md:p-10">

    <div class="w-full max-w-xl bg-white rounded-3xl shadow-2xl border border-slate-200/80 overflow-hidden transition-all duration-300">
        
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 p-6 sm:p-8 text-white relative">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight flex items-center gap-2">
                        <i data-lucide="check-square" class="w-7 h-7 text-indigo-200"></i>
                        Daftar Tugas
                    </h1>
                    <p class="text-indigo-100 text-sm mt-1 font-light">Kelola produktivitas Anda dengan lebih baik</p>
                </div>
                <!-- Progress Ring / Stat Badge -->
                <div class="bg-white/10 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/20 text-center">
                    <span id="stat-percent" class="text-xl font-extrabold block">0%</span>
                    <span class="text-[10px] uppercase tracking-wider text-indigo-200">Selesai</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-black/20 h-2 rounded-full mt-6 overflow-hidden">
                <div id="progress-bar" class="bg-emerald-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="p-6 sm:p-8 space-y-6">

            <!-- Form Input Tugas (Memenuhi syarat 1) -->
            <form id="todo-form" class="relative group">
                <div class="flex items-center gap-2 bg-slate-50 p-1.5 rounded-2xl border-2 border-slate-200 focus-within:border-indigo-500 focus-within:bg-white focus-within:ring-4 focus-within:ring-indigo-100 transition-all">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-slate-400 ml-3 shrink-0"></i>
                    <input 
                        type="text" 
                        id="todo-input" 
                        required 
                        placeholder="Ketik tugas baru lalu tekan Enter..." 
                        class="w-full bg-transparent py-2.5 px-2 text-slate-700 font-medium placeholder-slate-400 focus:outline-none text-sm sm:text-base"
                        autocomplete="off"
                    />
                    <button 
                        type="submit" 
                        id="btn-tambah"
                        class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition-all duration-200 flex items-center gap-2 shadow-md shadow-indigo-200 shrink-0 cursor-pointer"
                    >
                        <span>Tambah</span>
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>

            <!-- Filter Tabs -->
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs sm:text-sm">
                    <button type="button" data-filter="all" class="filter-btn active-filter px-3 py-1.5 rounded-lg font-medium transition-all text-slate-600 hover:text-slate-900">
                        Semua
                    </button>
                    <button type="button" data-filter="active" class="filter-btn px-3 py-1.5 rounded-lg font-medium transition-all text-slate-600 hover:text-slate-900">
                        Belum Selesai
                    </button>
                    <button type="button" data-filter="completed" class="filter-btn px-3 py-1.5 rounded-lg font-medium transition-all text-slate-600 hover:text-slate-900">
                        Selesai
                    </button>
                </div>

                <button id="clear-completed" class="text-xs text-slate-400 hover:text-rose-500 transition-colors flex items-center gap-1 hidden">
                    <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                    Bersihkan Selesai
                </button>
            </div>

            <!-- Daftar Tugas <ul> (Memenuhi syarat 2) -->
            <div class="relative">
                <ul id="todo-list" class="space-y-3 max-h-[360px] overflow-y-auto pr-1 custom-scrollbar min-h-[120px]">
                    <!-- Item tugas akan disisipkan di sini secara dinamis melalui JavaScript -->
                </ul>

                <!-- Empty State Display -->
                <div id="empty-state" class="hidden flex-col items-center justify-center py-10 text-center">
                    <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-400 mb-3">
                        <i data-lucide="clipboard-list" class="w-8 h-8"></i>
                    </div>
                    <p class="text-slate-600 font-medium">Belum ada tugas di sini!</p>
                    <p class="text-slate-400 text-xs mt-1">Tambahkan tugas baru menggunakan formulir di atas.</p>
                </div>
            </div>

            <!-- STREAMING_CHUNK:Adding status indicator element <p id="sisa">... -->
            <!-- Indikator Tugas Tersisa <p id="sisa"> (Memenuhi syarat 3) -->
            <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-sm">
                <p id="sisa" class="font-medium text-slate-500 flex items-center gap-2">
                    <!-- Text akan diupdate via JS -->
                </p>

                <span id="total-count" class="text-xs text-slate-400 font-medium">
                    Total: 0 tugas
                </span>
            </div>

        </div>
    </div>
</body>
</html>
